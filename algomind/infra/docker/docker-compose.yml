version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: ${API_PORT:-3000}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "3000:${API_PORT:-3000}"
    volumes:
      - ../apps/api:/app
    depends_on:
      - redis
      - postgres
      - minio

  runner:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ../apps/runner:/app
    depends_on:
      - redis
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
